# Norway priors, converted from the legacy globi fork (data/priors/Norway/priors.yaml)
# by norway-globi/scripts/convert_legacy_priors.py. Starting point only; not calibrated.
Name: Norway (legacy priors)
description: Walls, roof, windows, HVAC, DHW etc. conditioned on Typology x Age_bracket.

registry:
  fields:
  - name: Age_bracket
    values:
    - btw_1975_2003
    - post_2003
    - pre_1975
  - name: Cooling
    values:
    - ACWindow
    - ASHPCooling
    - WindowASHP
    - none
  - name: DHW
    values:
    - ElectricResistanceDHW
    - HPWH
    - OilHeating
  - name: Equipment
    values:
    - HighEfficiencyEquipment
    - LowEfficiencyEquipment
  - name: GroundSlabInsulation
    values:
    - InsulatedGroundSlab
    - UninsulatedGroundSlab
  - name: Heating
    values:
    - ASHPHeating
    - ElectricResistance
    - GSHPHeating
    - OilHeating
  - name: Lighting
    values:
    - LED
    - NoLED
  - name: RoofInsulation
    values:
    - HighlyInsulatedRoof
    - InsulatedRoof
    - UninsulatedRoof
  - name: Thermostat
    values:
    - Controls
    - NoControls
  - name: Typology
    values:
    - MFH
    - SFH
  - name: Walls
    values:
    - FullInsulationWallsCavity
    - FullInsulationWallsCavityExterior
    - SomeInsulationWalls
    - UninsulatedWalls
  - name: Weatherization
    values:
    - LeakyEnvelope
    - SomewhatLeakyEnvelope
    - TightEnvelope
  - name: Windows
    values:
    - DoublePaneLowE
    - SinglePane
    - TriplePaneLowE
priors:
  wwr:
    sampler:
      mean: 0.15
      std: 0.015
      clip_min: 0.1
      clip_max: 0.3
  f2f_height:
    source_feature: Age_bracket
    conditions:
    - match_val: pre_1975
      sampler:
        min: 2.4
        max: 2.7
    - match_val: btw_1975_2003
      sampler:
        min: 2.5
        max: 2.9
    - match_val: post_2003
      sampler:
        min: 2.6
        max: 3.0
    fallback_prior: null
joints:
- target: GroundSlabInsulation
  condition_on:
  - Age_bracket
  table:
    pre_1975:
      UninsulatedGroundSlab: 0.8
      InsulatedGroundSlab: 0.2
    btw_1975_2003:
      UninsulatedGroundSlab: 0.6
      InsulatedGroundSlab: 0.4
    post_2003:
      UninsulatedGroundSlab: 0.1
      InsulatedGroundSlab: 0.9
- target: Walls
  condition_on:
  - Typology
  - Age_bracket
  table:
    SFH.pre_1975:
      UninsulatedWalls: 0.6
      SomeInsulationWalls: 0.3
      FullInsulationWallsCavity: 0.1
    SFH.btw_1975_2003:
      UninsulatedWalls: 0.3
      SomeInsulationWalls: 0.4
      FullInsulationWallsCavity: 0.3
    SFH.post_2003:
      UninsulatedWalls: 0.05
      SomeInsulationWalls: 0.15
      FullInsulationWallsCavity: 0.6
      FullInsulationWallsCavityExterior: 0.2
    MFH.pre_1975:
      UninsulatedWalls: 0.55
      SomeInsulationWalls: 0.35
      FullInsulationWallsCavity: 0.1
    MFH.btw_1975_2003:
      UninsulatedWalls: 0.25
      SomeInsulationWalls: 0.45
      FullInsulationWallsCavity: 0.3
    MFH.post_2003:
      UninsulatedWalls: 0.05
      SomeInsulationWalls: 0.2
      FullInsulationWallsCavity: 0.6
      FullInsulationWallsCavityExterior: 0.15
  fallback:
    UninsulatedWalls: 0.2
    SomeInsulationWalls: 0.3
    FullInsulationWallsCavity: 0.4
    FullInsulationWallsCavityExterior: 0.1
