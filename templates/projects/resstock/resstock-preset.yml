# Generated by scripts/convert_resstock.py; edit the script and rerun rather than this file.
source:
  repo: https://github.com/NREL/resstock
  tag: v3.4.0
  file: resources/options_lookup.tsv
  license: ResStock license (BSD-style with extra clauses), see NOTICE
assumptions:
- 'R-values: ResStock''s assembly R (IP, incl. air films) x 0.1761 -> SI; an insulation layer is sized to reach 1/R (construction-for-U
  stacks).'
- Window U-factor (IP) x 5.678 -> W/m2K; SHGC as is; visible transmittance set equal to SHGC (ResStock doesn't give it).
- 'Infiltration: ACH50 x 0.05 -> air changes per hour.'
- 'Heat pumps: HSPF x 0.293 -> heating COP (dual-fuel treated as all-electric); GSHP COP as is.'
- 'Furnaces, boilers, baseboards: AFUE / efficiency -> COP; ''Fuel'' systems are NaturalGas (ResStock sets the fuel in Heating
  Fuel).'
- 'Cooling: SEER or EER x 0.293 -> COP; heat-pump cooling is set by HVAC Heating Efficiency, so those options are skipped.'
- 'Water heaters: EF / UEF -> COP; fuel from ResStock''s water_heater_fuel_type.'
- 'Lighting: interior bulb mix -> power relative to all-incandescent from typical efficacies {''incandescent'': 15, ''cfl'':
  60, ''led'': 90} lm/W (linear fluorescent as CFL); the starter lighting''s power density is taken as all-incandescent. Exterior
  and garage lighting are ignored.'
- 'Plug Loads: the starter equipment''s power density x ResStock''s plug-load usage multiplier.'
- 'Occupants: people / a reference floor area of 163 m2 (1,750 ft2, the middle of ResStock''s 1500-1999 bin); ''10+'' is 11.'
- 'Heating setpoint: constant all year, F -> C; the cooling setpoint stays the starter''s.'
- Every value ResStock doesn't set (distribution COP, schedules, layer materials, ...) keeps the starter archetype's.
